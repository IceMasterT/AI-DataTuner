<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t d"><title id="t">Pipeline overview</title><desc id="d">Raw documents flow through four phases, each with its own folder, to finished training data.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker><marker id="arrE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker></defs><rect width="1280" height="560" rx="18" fill="url(#bg)"/><text x="640" y="46" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e5e7eb" text-anchor="middle">The four-phase pipeline</text><text x="640" y="74" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9ca3af" text-anchor="middle">Each phase reads one folder and writes the next, so you can inspect or stop at any step.</text><rect x="40" y="110" width="208" height="250" rx="12" fill="#1f2937" stroke="#22d3ee" stroke-width="1.5"/><text x="56" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#22d3ee" text-anchor="start" letter-spacing="1">input/</text><text x="56" y="176" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e5e7eb" text-anchor="start">Raw documents</text><text x="56" y="212" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">PDF, CSV, JSON,</text><text x="56" y="233" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">JSONL, TXT, MD</text><line x1="251" y1="235" x2="275" y2="235" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrE)"/><rect x="278" y="110" width="208" height="250" rx="12" fill="#1f2937" stroke="#34d399" stroke-width="1.5"/><text x="294" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="1">Phase 1</text><text x="294" y="176" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e5e7eb" text-anchor="start">Sanitize + extract</text><text x="294" y="212" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">Unicode &amp; invisible-char</text><text x="294" y="233" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">cleaning, threat scan,</text><text x="294" y="254" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">PDF layout extraction,</text><text x="294" y="275" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">header/footer removal</text><line x1="489" y1="235" x2="513" y2="235" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrE)"/><rect x="294" y="315" width="176" height="30" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/><text x="382.0" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#9ca3af" text-anchor="middle">Phase 1/</text><rect x="516" y="110" width="208" height="250" rx="12" fill="#1f2937" stroke="#34d399" stroke-width="1.5"/><text x="532" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="1">Phase 2</text><text x="532" y="176" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e5e7eb" text-anchor="start">Chunk + validate</text><text x="532" y="212" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">Section hierarchy,</text><text x="532" y="233" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">paragraph-safe chunks,</text><text x="532" y="254" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">context breadcrumbs,</text><text x="532" y="275" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">validation report</text><line x1="727" y1="235" x2="751" y2="235" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrE)"/><rect x="532" y="315" width="176" height="30" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/><text x="620.0" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#9ca3af" text-anchor="middle">Phase 2/</text><rect x="754" y="110" width="208" height="250" rx="12" fill="#1f2937" stroke="#34d399" stroke-width="1.5"/><text x="770" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="1">Phase 3</text><text x="770" y="176" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e5e7eb" text-anchor="start">Voice + format</text><text x="770" y="212" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">Optional voice/tone,</text><text x="770" y="233" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">10 training formats,</text><text x="770" y="254" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">role validation,</text><text x="770" y="275" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">combined JSONL</text><line x1="965" y1="235" x2="989" y2="235" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrE)"/><rect x="770" y="315" width="176" height="30" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/><text x="858.0" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#9ca3af" text-anchor="middle">Phase 3/</text><rect x="992" y="110" width="208" height="250" rx="12" fill="#1f2937" stroke="#34d399" stroke-width="1.5"/><text x="1008" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="1">Phase 4</text><text x="1008" y="176" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e5e7eb" text-anchor="start">Quality scoring</text><text x="1008" y="212" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">LLM-scored sample,</text><text x="1008" y="233" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">0-100 per example,</text><text x="1008" y="254" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">filtering + report</text><rect x="1008" y="315" width="176" height="30" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/><text x="1096.0" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#9ca3af" text-anchor="middle">Phase 4/</text><line x1="858" y1="372" x2="858" y2="408" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrE)"/><rect x="40" y="410" width="1200" height="110" rx="12" fill="#1f2937" stroke="#34d399" stroke-width="1.8"/><text x="64" y="446" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#34d399" text-anchor="start">Training data</text><text x="64" y="474" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9ca3af" text-anchor="start">Phase 3 emits the chosen format (one file per document, plus an optional combined chatgpt_training.jsonl).</text><text x="64" y="498" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9ca3af" text-anchor="start">Phase 4 adds a quality report. Every phase also keeps its own audit trail (logs, manifests, quarantine).</text></svg>
