<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d"><title id="t">Naive chunking versus structure-aware chunking</title><desc id="d">Naive chunks carry headers and cut lists; structure-aware chunks are whole sections with a breadcrumb.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker><marker id="arrE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker></defs><rect width="1280" height="640" rx="18" fill="url(#bg)"/><text x="640" y="46" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e5e7eb" text-anchor="middle">Why structure-aware chunking retrieves better</text><text x="640" y="74" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9ca3af" text-anchor="middle">The same page, chunked two ways.</text><text x="60" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#f87171" text-anchor="start">NAIVE: fixed-size character windows</text><rect x="50" y="140" width="540" height="112" rx="12" fill="#1f2937" stroke="#f87171" stroke-width="1.2" stroke-dasharray="5 4"/><text x="68" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#f87171" text-anchor="start">Tent Social Marketing Strategy Series</text><text x="572" y="172" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f87171" text-anchor="end">running header</text><text x="68" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#e5e7eb" text-anchor="start">Four Tips for Goal Setting: 1. Make It Medium To</text><rect x="50" y="270" width="540" height="112" rx="12" fill="#1f2937" stroke="#f87171" stroke-width="1.2" stroke-dasharray="5 4"/><text x="68" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#e5e7eb" text-anchor="start">Long Term.  2. Balance Financial and Non-</text><text x="68" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#f87171" text-anchor="start">Financial Goals.  Page 4</text><text x="572" y="330" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f87171" text-anchor="end">page footer</text><text x="68" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#f87171" text-anchor="start">Tent Social Marketing Strategy Series</text><text x="572" y="358" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f87171" text-anchor="end">running header</text><rect x="50" y="400" width="540" height="112" rx="12" fill="#1f2937" stroke="#f87171" stroke-width="1.2" stroke-dasharray="5 4"/><text x="68" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#e5e7eb" text-anchor="start">3. Be Realistic.  4. Prioritize Key Metrics.</text><text x="68" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#fbbf24" text-anchor="start">Step Two. The Audience.</text><text x="572" y="460" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#fbbf24" text-anchor="end">next section bleeds in</text><text x="60" y="548" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">The four tips are split across three chunks,</text><text x="60" y="570" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">furniture is embedded, and there is no hint of which</text><text x="60" y="592" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">chapter any chunk came from.</text><text x="690" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#34d399" text-anchor="start">STRUCTURE-AWARE: sections, then paragraphs</text><rect x="680" y="140" width="550" height="270" rx="12" fill="#1f2937" stroke="#34d399" stroke-width="1.5"/><rect x="696" y="154" width="518" height="62" rx="8" fill="#0b1220"/><text x="712" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#22d3ee" text-anchor="start">Document: The Ten Step Social Media Blueprint</text><text x="712" y="199" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#22d3ee" text-anchor="start">Section: Step One - The Destination &gt; Four Tips</text><text x="698" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#e5e7eb" text-anchor="start">Four Tips for Goal Setting:</text><text x="698" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#e5e7eb" text-anchor="start">1. Make It Medium To Long Term.</text><text x="698" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#e5e7eb" text-anchor="start">2. Balance Financial and Non-Financial Goals.</text><text x="698" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#e5e7eb" text-anchor="start">3. Be Realistic.</text><text x="698" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#e5e7eb" text-anchor="start">4. Prioritize Key Metrics.</text><text x="1214" y="396" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#34d399" text-anchor="end">one chunk · pages 4-5 · quality: clean</text><rect x="680" y="430" width="550" height="70" rx="10" fill="#111827" stroke="#374151" stroke-width="1"/><text x="698" y="458" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9ca3af" text-anchor="start">Removed and logged, never silently dropped:</text><text x="698" y="482" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#fbbf24" text-anchor="start">header ×12 · footer ×12 · page numbers ×12</text><text x="690" y="548" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">The tips stay together, every chunk names its section,</text><text x="690" y="570" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">and the removed furniture is recorded in an audit file</text><text x="690" y="592" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af" text-anchor="start">so you can check nothing useful was lost.</text></svg>
